appId: com.asntechnology.pos
productName: ASN POS
copyright: "Copyright © 2026 ASN Technology"

directories:
  output: dist
  buildResources: assets
  app: .

files:
  - electron/**/*
  - assets/**/*
  - .env
  - package.json
  - node_modules/**/*
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!app/**/*"
  - "!dist/**/*"
  - "!dist-atyab/**/*"
  - "!*.log"
  - "!build_log.txt"

extraResources:
  - from: app
    to: app
    filter:
      - "**/*"
  - from: app/node_modules
    to: app/node_modules
    filter:
      - "**/*"

win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.png

nsis:
  oneClick: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ASN POS

asar: true
npmRebuild: false
compression: store
